name: CI

on:
  push:
  pull_request:
  # The audits below only find something when somebody else publishes an
  # advisory, which does not wait for a push. Sunday, early UTC, off the hour
  # so it is not queued behind everybody else's midnight cron.
  schedule:
    - cron: '17 6 * * 0'

# Nothing here writes anything back.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # Actions are pinned by commit, not by tag: a tag can be moved to point
      # at different code. The tag rides in the comment for humans.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install
        run: |
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy

      - name: Tests
        run: pytest -q

      # Installed with pip into the same environment rather than through pipx,
      # which is not present on the runner. Last, so it cannot disturb the
      # environment the tests above ran in.
      - name: Audit dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit --no-deps -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm audit --omit=dev

  # The stack as a deployment builds it: the compose file parses, and both
  # images build. Nothing is started and nothing is pushed.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The compose file reads .env, and refuses outright without a database
      # password. The example values are enough to parse and build with,
      # because nothing here is started.
      - name: Configure
        run: cp .env.example .env

      - name: Config
        run: docker compose -f docker-compose.yml config

      - name: Build
        run: docker compose -f docker-compose.yml build
