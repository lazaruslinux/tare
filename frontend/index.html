<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- Kept in step with --bg by theme.ts, which rewrites it when the theme
         changes; a meta tag cannot read a custom property. -->
    <meta name="theme-color" content="#101312" />
    <title>Tare</title>
    <!-- What a messenger shows when a link to the app is pasted into it. The
         two placeholders are filled in by nginx as it serves this file: the
         origin, which is not known at build time, and the line, which says
         something different for an invite. See frontend/nginx.conf. -->
    <meta name="description" content="__DESCRIPTION__" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tare" />
    <meta property="og:title" content="Tare" />
    <meta property="og:description" content="__DESCRIPTION__" />
    <meta property="og:image" content="__ORIGIN__/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tare" />
    <meta name="twitter:description" content="__DESCRIPTION__" />
    <meta name="twitter:image" content="__ORIGIN__/icon-512.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
