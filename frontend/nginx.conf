# Serves the built app and forwards /api to the backend container, so the
# browser only ever talks to one origin.

# What to tell the backend about the original scheme. A TLS-terminating proxy
# in front of this container already sends X-Forwarded-Proto: https and that
# has to survive this hop; with nothing in front, our own scheme is the truth.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

# The api, looked up again as its address changes and reached over connections
# that stay open between requests. `resolve` keeps the name live (recreating the
# api container gives it a new address; nginx follows within the resolver's
# validity) and `keepalive` holds idle connections per worker so a request does
# not open a socket each time.
upstream api {
    zone api 64k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    server api:8000 resolve;
    keepalive 32;
}

# The three addresses somebody arrives at from a link, each carrying a
# single-use credential in the URL. Kept out of the access log, so a token that
# is still good is not written to a file that outlives it. A map on the request
# rather than a location: the app is served for these by the same fallback as
# every other route, and it is the request that must not be written down.
map $request_uri $loggable {
    default 1;
    ~^/verify-email(\?|$) 0;
    ~^/reset-password(\?|$) 0;
    ~^/welcome/ 0;
}

# The line a link preview carries. An invite says what it is inviting somebody
# to; every other address says what the app is. Read off $request_uri, which
# keeps the address asked for through the fallback to /index.html.
map $request_uri $preview_line {
    default "A community-managed nutrition app.";
    ~^/welcome/ "You're invited to try Tare, a community-managed nutrition app.";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log main if=$loggable;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/javascript text/css;

    # Docker's own resolver, for the addresses other than the api that a
    # location may name. The api's own lookup lives in its upstream block.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # A body past the cap below is refused by nginx before the api sees it, so
    # the answer is nginx's to write. It is written in the app's shape, and
    # repeated inside each proxy location because error_page does not inherit
    # into a block that sets one of its own.
    error_page 413 = @toolarge;

    # add_header is NOT inherited into a location that sets any header of its
    # own, so this whole block is repeated verbatim in every location below.
    # The transport header is ignored by a browser that arrived over plain
    # http, so it costs a local install nothing to send it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The one address that takes a file. Regex, and anchored, so it wins over
    # the prefix below without the photos underneath it inheriting the room:
    # GET /api/photos/12.webp does not match this and is capped at 64k like
    # everything else. A little above the ten megabytes the application
    # allows, so an upload that is merely too big is refused by the route's
    # own sentence rather than by a body cut off mid-stream.
    location ~ ^/api/photos$ {
        client_max_body_size 11m;
        # No URI part, so the original request path is forwarded unchanged.
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        error_page 502 503 504 = @down;
        error_page 413 = @toolarge;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # The third address that takes a file: the picture a member is shown by,
    # already framed to a square by the screen that sends it. A little above
    # the five megabytes the application allows, for the same reason.
    location ~ ^/api/account/avatar$ {
        client_max_body_size 6m;
        # No URI part, so the original request path is forwarded unchanged.
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        error_page 502 503 504 = @down;
        error_page 413 = @toolarge;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # The other address that takes a file: a health export somebody picked
    # rather than a photo. Anchored the same way, and a little above the
    # fifteen megabytes the application allows, so an export that is merely
    # too big is refused by the route's own sentence.
    location ~ ^/api/ingest/(health|upload)$ {
        client_max_body_size 16m;
        # A first sync carries years, and the api parses it a row at a time.
        # The stock minute is short enough to cut one off part way through.
        proxy_read_timeout 100s;
        # No URI part, so the original request path is forwarded unchanged.
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        error_page 502 503 504 = @down;
        error_page 413 = @toolarge;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location /api/ {
        # Every other address takes JSON and nothing else. The application
        # enforces the same ceiling; this one holds even if a route forgets to.
        client_max_body_size 64k;
        # No URI part, so the original request path is forwarded unchanged.
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        error_page 502 503 504 = @down;
        error_page 413 = @toolarge;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # An api that is not answering says so in the one shape the app reads, not
    # in nginx's stock HTML page. The headers are repeated here for the same
    # reason as everywhere else: add_header does not inherit into a location
    # that sets one of its own.
    location @down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 503 '{"detail":"The server is not answering. Try again in a moment."}';
    }

    # A body over the cap for the address it was sent to. The same sentence the
    # api's own middleware uses, so a client reads one answer either way.
    location @toolarge {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 413 '{"detail":"Request body is too large."}';
    }

    # Every filename here carries a content hash, so a stale copy is never the
    # wrong copy.
    location /assets/ {
        # No `expires` directive alongside this: it would emit a second,
        # weaker Cache-Control beside the one below.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # The one file that must never be cached: it names which hashed assets this
    # deploy uses, and a cached copy points at files that are no longer there.
    location = /index.html {
        # The preview tags are written with placeholders in the source, because
        # a link preview needs an absolute image URL and the repo holds no
        # hostname. Filled in here, per request, off the Host the app was asked
        # for. Deployments are https; the dev rig's own preview URL points at a
        # https address that is not there, and is not meant to be fetched.
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '__ORIGIN__' 'https://$host';
        sub_filter '__DESCRIPTION__' '$preview_line';
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Browsers only install a web app whose manifest is served as one, and
    # nginx's type table has no row for the extension.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # The service worker and the runtime it loads. Never cached, for the same
    # reason as index.html: each names the build it belongs to, and a stale copy
    # would keep serving a deploy that is gone.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ~ ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # The optional basemap: one archive and the lettering and symbols beside
    # it, mounted in from the host rather than built into the image. The
    # archive is read a sliver at a time by byte range, which nginx answers on
    # its own; it is not in gzip_types, so a range of it is a range of the
    # bytes on disk. An hour is long enough to keep a session's tiles and short
    # enough that recutting the archive is seen the same day.
    location /tiles/ {
        alias /usr/share/nginx/tiles/;
        try_files $uri @notiles;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Nothing mounted, or a letter this cut of the fonts does not carry. An
    # empty answer rather than a page of not-found HTML: the app asks for the
    # archive before it decides to draw a map at all, and a console full of
    # 404s would be the only thing that came of it.
    location @notiles {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 204;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
