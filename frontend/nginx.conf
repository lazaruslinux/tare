# Serves the built app and forwards /api to the backend container, so the
# browser only ever talks to one origin.

# What to tell the backend about the original scheme. A TLS-terminating proxy
# in front of this container already sends X-Forwarded-Proto: https and that
# has to survive this hop; with nothing in front, our own scheme is the truth.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/javascript text/css;

    # add_header is NOT inherited into a location that sets any header of its
    # own, so this whole block is repeated verbatim in every location below.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    location /api/ {
        # Nothing here accepts a file yet. The application enforces the same
        # ceiling; this one holds even if a route forgets to.
        client_max_body_size 64k;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }

    # Every filename here carries a content hash, so a stale copy is never the
    # wrong copy.
    location /assets/ {
        # No `expires` directive alongside this: it would emit a second,
        # weaker Cache-Control beside the one below.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }

    # The one file that must never be cached: it names which hashed assets this
    # deploy uses, and a cached copy points at files that are no longer there.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
